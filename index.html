<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <!-- Header UI -->
    <header id="ui-header">
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span id="score-val" class="stat-value">0</span>
      </div>
      <div id="game-title">NEON SNAKE</div>
      <div class="stat-box">
        <span class="stat-label">HIGH SCORE</span>
        <span id="high-score-val" class="stat-value">0</span>
      </div>
    </header>

    <!-- Canvas Wrapper -->
    <div id="canvas-wrapper">
      <canvas id="game-canvas" width="600" height="600"></canvas>

      <!-- Overlay Menus -->
      <div id="start-overlay" class="overlay active">
        <h1 class="glow-text">NEON SNAKE</h1>
        <p class="subtitle">SELECT DIFFICULTY</p>
        <div class="difficulty-select">
          <button class="diff-btn" data-speed="140">EASY</button>
          <button class="diff-btn active" data-speed="90">MEDIUM</button>
          <button class="diff-btn" data-speed="50">HARD</button>
        </div>
        <button id="start-btn" class="primary-btn">PLAY GAME</button>
      </div>

      <div id="pause-overlay" class="overlay">
        <h1 class="glow-text">PAUSED</h1>
        <p class="subtitle">PRESS 'P' OR SPACE TO RESUME</p>
        <button id="resume-btn" class="primary-btn">RESUME</button>
      </div>

      <div id="gameover-overlay" class="overlay">
        <h1 class="glow-text danger">GAME OVER</h1>
        <p id="final-score" class="subtitle">FINAL SCORE: 0</p>
        <button id="restart-btn" class="primary-btn">PLAY AGAIN</button>
      </div>
    </div>

    <!-- On-Screen Controls for Mobile -->
    <div id="mobile-controls">
      <button class="dpad-btn" id="btn-up">▲</button>
      <div class="dpad-row">
        <button class="dpad-btn" id="btn-left">◄</button>
        <button class="dpad-btn" id="btn-pause">❚❚</button>
        <button class="dpad-btn" id="btn-right">►</button>
      </div>
      <button class="dpad-btn" id="btn-down">▼</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
